# ══════════════════════════════════════════════════════════════════════
# G1Pilot Universal Docker-Compose
# Sim:  G1_SIM_MODE=true docker compose --profile sim up
# Real: G1_SIM_MODE=false docker compose --profile real up
# ══════════════════════════════════════════════════════════════════════


# ── Gemeinsame Basis-Konfiguration für G1Pilot Container ────────────
x-g1pilot-base: &g1pilot-base
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: g1pilot:v1.1.0
  network_mode: host         # KRITISCH: DDS braucht Host-Netzwerk!
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - .:/ros2_ws/src/g1pilot:rw   # Live-Code in den colcon-Workspace mounten
  stdin_open: true
  tty: true
  restart: "no"          # interaktiv: bei Fehler NICHT endlos im Hintergrund neustarten

services:

  # ══════════════════════════════════════════════════════════════════
  # SIMULATION SERVICES (nur bei --profile sim)
  # ══════════════════════════════════════════════════════════════════

  mujoco-sim:
    # ── MuJoCo G1 Simulator ────────────────────────────────────────
    profiles: ["sim"]
    build:
      context: ..
      dockerfile: g1pilot/docker/Dockerfile.mujoco
    image: g1pilot-mujoco:v1.0
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - MUJOCO_GL=glfw
      # weld = Arm-only (Basis fix), off = Loco-Modus (Basis frei). Siehe run_sim_loco.sh.
      - HOLD_BASE_MODE=${HOLD_BASE_MODE:-weld}
      # Realtime-Faktor (1.0 = Echtzeit). Nur OHNE Lockstep relevant.
      - SIM_REALTIME_FACTOR=${SIM_REALTIME_FACTOR:-1.0}
      # Lockstep: deterministische Regelrate (decimation Physikschritte pro
      # rt/lowcmd). run_sim_loco.sh setzt 1 -> garantierte 50 Hz fuer die Policy.
      - SIM_LOCKSTEP=${SIM_LOCKSTEP:-1}
      # Inspire-FTP-Haende laden (1) statt Rubber-Hand. config.py waehlt die Scene.
      - G1_INSPIRE_HANDS=${G1_INSPIRE_HANDS:-0}
      # Umgebung: G1 bleibt gleich, nur die Welt wechselt. Leer/"default" =
      # bisheriges Terrain (scene.xml). Sonst laedt config.py die von start.sh
      # erzeugte kombinierte Szene scene_env_<G1_ENV>.xml. Siehe scene_editor/.
      - G1_ENV=${G1_ENV:-}
      # Szenen-Bruecke (Umgebungs-Objekte -> RViz/Nav/IK, siehe g1pilot/docs/51_navigation_technik.md):
      # UDP-Port MUSS mit g1pilot-sim uebereinstimmen (unten dieselbe Variable).
      - SIM_SCENE_PORT=${SIM_SCENE_PORT:-47902}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../unitree_mujoco:/unitree_mujoco:ro   # Mountet dein lokales Repo!
    command: >
      bash -c "cd /unitree_mujoco/simulate_python &&
               python3 unitree_mujoco.py"
    restart: "no"          # bei X11-/GLFW-Fehler nicht endlos neustarten
    tty: true

  g1pilot-sim:
    # ── G1Pilot im Simulations-Modus ───────────────────────────────
    profiles: ["sim"]
    <<: *g1pilot-base
    # Schlankes Sim-Image: KEIN livox/MOLA (die braucht nur der echte Roboter
    # und ihr Build schlägt sonst fehl). Nur rviz2/pin/tf2/cyclonedds/sdk.
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    image: g1pilot-sim:v1.1.0
    environment:
      - DISPLAY=${DISPLAY}
      - G1_SIM_MODE=true          # ← Aktiviert Simulation in Python-Code
      # ROS-Graph-Domain MUSS sich von der Unitree-DDS-Domain (1 im Sim)
      # unterscheiden, sonst kollidieren rmw_cyclonedds und unitree_sdk2py
      # im selben Prozess (robot_state crasht: "create domain error").
      - ROS_DOMAIN_ID=0
      # KRITISCH: ROS auf CycloneDDS zwingen. Sonst nimmt Humble den Default
      # (FastDDS), der die cyclonedds.xml IGNORIERT und SPDP-Multicast auf ALLEN
      # Interfaces (inkl. WLAN) macht -> flutet wlanX, crasht z.B. iwlwifi-Firmware.
      # Mit CycloneDDS greift /etc/cyclonedds.xml (nur lo, Multicast aus, Peer 127.0.0.1).
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
      # Nur fuer die loco_sim-Timing-Diagnose: gleicher Wert wie bei mujoco-sim,
      # damit die effektive Sim-Zeit-Rate (wall_hz/factor) korrekt geloggt wird.
      - SIM_REALTIME_FACTOR=${SIM_REALTIME_FACTOR:-1.0}
      # Lockstep: loco_sim taktet dann auf den rt/lowstate-Eingang (ein Kommando
      # pro State) statt auf die Wall-Clock. MUSS zum mujoco-sim-Wert passen.
      - SIM_LOCKSTEP=${SIM_LOCKSTEP:-1}
      # Start-Menue (start.sh): RViz mitstarten? bringup_sim.launch.py liest das.
      - USE_RVIZ=${USE_RVIZ:-false}
      # Inspire-Haende: bringup_sim.launch.py startet dann inspire_hand und setzt
      # robot_state publish_hand_joints:=false (sonst doppelte Finger-/joint_states).
      - G1_INSPIRE_HANDS=${G1_INSPIRE_HANDS:-0}
      # Navigation (g1pilot-Ansatz) in der Sim mitstarten: dijkstra_planner +
      # nav2point + Sim-Glue (sim_localization, joy_to_cmdvel). Siehe g1pilot/docs/50_navigation_anleitung.md.
      - G1_ENABLE_NAV=${G1_ENABLE_NAV:-0}
      # Szenen-Bruecke (siehe g1pilot/docs/51_navigation_technik.md): MUSS zum mujoco-sim-Wert oben passen.
      - SIM_SCENE_PORT=${SIM_SCENE_PORT:-47902}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/ros2_ws/src/g1pilot:rw
      # Scene Editor read-only mounten, damit RViz MESH_RESOURCE-Marker
      # (/scene_markers, siehe scene_bridge.py) tatsaechlich laden kann -- der
      # g1pilot-Container hat sonst KEINEN Zugriff auf unitree_mujoco/ (das
      # liegt nur im mujoco-sim-Container). Ganzer Ordner, weil Umgebungen ihre
      # Meshes in scenes/<name>/meshes/ mitbringen. Fixer Pfad, den
      # scene_bridge.py als mesh_resource_prefix-Default erwartet.
      - ../unitree_mujoco/scene_editor:/scene_editor:ro
    command: >
      bash -c "cd /ros2_ws &&
               source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               colcon build --packages-select g1pilot --symlink-install &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch g1pilot bringup_sim.launch.py"
    depends_on:
      - mujoco-sim

  # ══════════════════════════════════════════════════════════════════
  # REAL HARDWARE SERVICES (nur bei --profile real)
  # ══════════════════════════════════════════════════════════════════

  g1pilot-real:
    # ── G1Pilot mit echtem G1 (schlank: Arme + Haende + Unitree-Loco) ──
    # Roboter per LAN (192.168.123.x), Haende ebenfalls im Roboter-LAN.
    # LiDAR/Nav: G1_ENABLE_LIDAR=1 + grosses Image (siehe g1pilot-real-full).
    profiles: ["real"]
    <<: *g1pilot-base
    build:
      context: .
      dockerfile: docker/Dockerfile.real
    image: g1pilot-real:v1.2.0
    # PS4-Controller (evdev) braucht Zugriff auf /dev/input + udev-Infos.
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - G1_SIM_MODE=false         # ← Echter Roboter (Unitree-DDS: Domain 0)
      # ROS-Graph-Domain MUSS sich von der Unitree-DDS-Domain (0 auf real!)
      # unterscheiden, sonst kollidieren rmw_cyclonedds und unitree_sdk2py im
      # selben Prozess ("create domain error"). Spiegelbild der Sim (ROS=0/UT=1).
      - ROS_DOMAIN_ID=1
      # ROS auf CycloneDDS + loopback-Config zwingen (haelt den ROS-Graph vom
      # Roboter-LAN fern; das Unitree-SDK bindet ROBOT_INTERFACE selbst).
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///etc/cyclonedds.xml
      # Physisches Interface zum G1 (start.sh fragt es ab / erkennt es).
      - ROBOT_INTERFACE=${ROBOT_INTERFACE:-eth0}
      # RViz default AN: der rviz-Marker ist das Interface der Arm-Manipulation.
      - USE_RVIZ=${USE_RVIZ:-true}
      # Inspire-FTP-Haende (Modbus TCP im Roboter-LAN).
      - G1_INSPIRE_HANDS=${G1_INSPIRE_HANDS:-0}
      - G1_HAND_LEFT_HOST=${G1_HAND_LEFT_HOST:-192.168.123.210}
      - G1_HAND_RIGHT_HOST=${G1_HAND_RIGHT_HOST:-192.168.123.211}
      - G1_HAND_PORT=${G1_HAND_PORT:-6000}
      # PS4-Controller-Gerätename (evdev); Bluetooth-PS4 = "Wireless Controller".
      - JOYSTICK_NAME=${JOYSTICK_NAME:-Wireless Controller}
      # Konservative Walk-Limits fuer die ersten Tests (loco_client skaliert
      # die normierten UI-/PS4-Kommandos damit).
      - G1_MAX_VX=${G1_MAX_VX:-0.4}
      - G1_MAX_VY=${G1_MAX_VY:-0.3}
      - G1_MAX_VYAW=${G1_MAX_VYAW:-0.4}
      - G1_ENABLE_LIDAR=${G1_ENABLE_LIDAR:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/ros2_ws/src/g1pilot:rw
      - /dev/input:/dev/input      # PS4-Controller (evdev)
    command: >
      bash -c "cd /ros2_ws &&
               source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               colcon build --packages-select g1pilot --symlink-install &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch g1pilot bringup_real.launch.py"

  g1pilot-real-full:
    # ── Voller Real-Stack (Livox MID360 + MOLA + Navigation) ───────────
    # Braucht das grosse Image (docker/Dockerfile) und den LiDAR. Fuer den
    # ersten Hardware-Betrieb NICHT noetig -- siehe g1pilot-real.
    profiles: ["real-full"]
    <<: *g1pilot-base
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - G1_SIM_MODE=false
      - ROS_DOMAIN_ID=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROBOT_INTERFACE=${ROBOT_INTERFACE:-eth0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/ros2_ws/src/g1pilot:rw
      - /dev:/dev                  # Livox/USB/Gamepad
    command: >
      bash -c "cd /ros2_ws &&
               source /opt/ros/humble/setup.bash &&
               source /ros2_ws/install/setup.bash &&
               colcon build --packages-select g1pilot --symlink-install &&
               source /ros2_ws/install/setup.bash &&
               ros2 launch g1pilot bringup_launcher.launch.py
                 use_robot:=true
                 interface:=${ROBOT_INTERFACE:-eth0}"

  # ══════════════════════════════════════════════════════════════════
  # SCENE EDITOR (nur bei --profile editor)
  # ══════════════════════════════════════════════════════════════════

  scene-editor:
    # ── Umgebungen bauen + CAD-Import im Browser (http://127.0.0.1:8080) ──
    # Fuer Windows/Docker Desktop (oder Linux ohne passendes Host-Python).
    # Unter Linux geht weiterhin der Host-Weg: scene_editor/setup.sh + launch.sh.
    #   make editor                           -> Menue von launch.sh
    #   make editor ARGS="new"                -> direkt leerer Editor
    #   make editor ARGS="import /import/..." -> CAD-Datei als Umgebung
    profiles: ["editor"]
    build:
      context: ../unitree_mujoco/scene_editor
      dockerfile: ../../g1pilot/docker/Dockerfile.scene_editor
    image: g1pilot-scene-editor:v1.0
    # Eigene Nutzer-ID, damit gespeicherte Umgebungen auf einem Linux-Host
    # nicht root gehoeren (unter Docker Desktop/Windows egal).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - SCENE_EDITOR_PORT=8080
      - G1_INSPIRE_HANDS=${G1_INSPIRE_HANDS:-0}
    ports:
      # Nur lokal erreichbar: der Editor kann Dateien im Repo schreiben.
      - "127.0.0.1:${SCENE_EDITOR_PORT:-8080}:8080"
    volumes:
      # Code, scenes/ und meshes/ live aus dem Repo (Ergebnisse landen dort),
      # unitree_robots/ fuer build_env_scene.py (G1 + Umgebung kombinieren).
      - ../unitree_mujoco:/unitree_mujoco:rw
      # Ordner mit CAD-Dateien fuer './launch.sh import /import/<datei>'
      # (Default: Repo-Wurzel). Im Browser geht der Upload-Knopf ohnehin.
      - ${SCENE_IMPORT_DIR:-..}:/import:ro
      # Objaverse-Katalog & Caches bleiben ueber Neustarts erhalten.
      - scene-editor-home:/home/editor
    working_dir: /unitree_mujoco/scene_editor
    command: ["bash", "launch.sh"]
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  scene-editor-home:
